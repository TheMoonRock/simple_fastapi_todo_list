# Корневой раздел. Здесь перечисляются все сервисы (контейнеры), которые Docker должен создать и запустить в единой виртуальной сети.
services:
# Имя сервиса. Оно же становится сетевым именем (хостом) внутри Docker. Другие контейнеры смогут обращаться к базе по адресу db.
  db:
  # Готовый образ. Docker скачает официальный образ PostgreSQL 16-й версии на базе облегчённого Linux-дистрибутива Alpine (занимает мало места).
    image: postgres:16-alpine
    # Политика перезапуска. Если контейнер упадёт из-за ошибки или перезагрузится сам сервер, Docker автоматически запустит его снова. Остановится он только если вы сделаете это вручную (docker compose stop).
    restart: unless-stopped
    # Переменные окружения. При первом запуске PostgreSQL читает их, чтобы создать пользователя, пароль и пустую базу данных.
    # Синтаксис ${ПЕРЕМЕННАЯ:-значение}. Означает: «возьми значение из системного окружения или файла .env, а если его там нет — используй значение по умолчанию после :-» (например, todo_user).
    environment:
    # Оператор :- задаёт значение по умолчанию
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
    # Проброс портов (хост:контейнер). Связывает порт 5432 на вашем компьютере с портом 5432 внутри контейнера. Это позволяет подключаться к базе с вашего ПК (например, через DBeaver или pgAdmin).
    ports:
      - "5433:5432"
    # Подключение тома (хранилища). Папка внутри контейнера, где Postgres хранит файлы базы, привязывается к именованному тому postgres_data. Без этого при удалении или обновлении контейнера все данные исчезли бы.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Проверка здоровья. Инструкция для Docker, как понять, что база данных не просто запустилась как процесс, а реально готова принимать подключения.
    healthcheck:
      # Команда проверки. Внутри контейнера запускается встроенная утилита pg_isready, которая стучится в базу от имени указанного пользователя.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo_user} -d ${POSTGRES_DB:-todo_db}"]
      # Тайминги проверки. После старта контейнера Docker ждёт 10 секунд (start_period), затем каждые 5 секунд (interval) запускает тест. На ответ даётся 5 секунд (timeout). Если тест провалится 5 раз подряд (retries), контейнер получит статус unhealthy.
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  # Имя второго сервиса. Ваш бэкенд (судя по драйверу asyncpg, это Python-приложение на FastAPI или аналогичном фреймворке).
  api:
    # Сборка из Dockerfile. Вместо скачивания готового образа из интернета Docker соберёт свой образ, используя Dockerfile, который лежит в текущей папке (.).
    build: .
    # Политика перезапуска. Аналогично базе данных — перезапускать при сбоях, если не остановлено вручную.
    restart: unless-stopped
    # Проброс портов. Открывает порт 8000 наружу. Вы сможете делать запросы к API из браузера по адресу http://localhost:8000.
    ports:
      - "8000:8000"
    # Строка подключения к БД. Передаётся в ваш код. Обратите внимание на хост @db:5432 — здесь используется имя первого сервиса (db), так как внутри сети Docker контейнеры общаются по именам сервисов, а не через localhost.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-todo_user}:${POSTGRES_PASSWORD:-todo_pass}@db:5432/${POSTGRES_DB:-todo_db}
    # Умный порядок запуска. Контейнер api не начнёт запускаться, пока сервис db не пройдёт свой healthcheck и не получит статус healthy. Это защищает приложение от падения при старте из-за того, что база ещё не успела инициализироваться.
    depends_on:
      db:
        condition: service_healthy
    # Bind mount (проброс локальной папки). Папка ./app с вашего компьютера напрямую монтируется в папку /app внутри контейнера. Это удобно для разработки: вы меняете код в редакторе на ПК, и он мгновенно обновляется внутри контейнера без необходимости его пересобирать.
    volumes:
      - ./app:/app/app
# Регистрация именованного тома. Здесь мы говорим Docker: «создай и управляй постоянным хранилищем с именем postgres_data». Именно на него мы ссылались выше в настройках сервиса db.
volumes:
  postgres_data: